[package]
name = "backlog-inbox"
version = "0.8.0"
description = "Backlog Inbox keeps you up to date with Backlog notifications and issues"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "backlog_inbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
backlog-mcp = { git = "https://github.com/takuji/backlog-mcp-rs.git", default-features = false, features = ["rustls-tls"] }
backlog-api-rs = { git = "https://github.com/takuji/backlog-api-rs.git", default-features = false, features = ["rustls-tls"] }
sys-locale = "0.3"
base64 = "0.22"
tokio = { version = "1", features = ["time", "macros"] }

# macOS はクリック可能な通知を出すため mac-notification-sys を直接使う
# (tauri-plugin-notification はクリックを検知できないため。Windows/Linux は
# 引き続きプラグイン側を使う)。
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
